<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Цифра Спорта — Аналитика</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F1F5F9;
      color: #0F172A;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .sheet-backdrop { transition: opacity 0.25s ease; }
    .sheet-panel { transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1); }
  </style>
</head>
<body class="pb-24">

  <!-- Шапка приложения (Темно-синяя) -->
  <header class="bg-[#0F172A] text-white pt-4 pb-5 px-4 rounded-b-3xl shadow-md sticky top-0 z-20">
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center font-extrabold text-lg tracking-tighter shadow-inner">
          ЦС
        </div>
        <div>
          <h1 class="font-bold text-base leading-tight tracking-tight">Цифра Спорта</h1>
          <p id="sync-status" class="text-[11px] text-slate-400">Автопоиск матчей • Синхронизация...</p>
        </div>
      </div>
      <button onclick="loadMatchesFromFeed(true)" class="bg-slate-800/90 hover:bg-slate-700 border border-slate-700 px-2.5 py-1 rounded-full flex items-center gap-1.5 active:scale-95 transition">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-[11px] font-medium text-slate-200">↻ Авто-линия</span>
      </button>
    </div>

    <!-- Фильтры видов спорта -->
    <div id="filter-bar" class="flex gap-2 overflow-x-auto no-scrollbar">
      <button data-filter="all" class="filter-btn bg-white text-[#0F172A] font-semibold text-xs px-3.5 py-1.5 rounded-full shrink-0 shadow-sm transition">
        Все матчи
      </button>
      <button data-filter="football" class="filter-btn bg-slate-800/80 text-slate-300 hover:text-white font-medium text-xs px-3.5 py-1.5 rounded-full shrink-0 transition">
        ⚽ Футбол
      </button>
      <button data-filter="hockey" class="filter-btn bg-slate-800/80 text-slate-300 hover:text-white font-medium text-xs px-3.5 py-1.5 rounded-full shrink-0 transition">
        🏒 Хоккей
      </button>
      <button data-filter="value" class="filter-btn bg-slate-800/80 text-slate-300 hover:text-white font-medium text-xs px-3.5 py-1.5 rounded-full shrink-0 transition">
        🔥 Валуи (Value)
      </button>
    </div>
  </header>

  <!-- Секция: Главные матчи дня -->
  <section class="mt-4">
    <div class="px-4 flex items-center justify-between mb-2.5">
      <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-[#1E3A8A]"></span>
        Главные матчи дня
      </h2>
      <span class="text-[11px] font-semibold text-[#1E3A8A]">Нажмите для объяснения →</span>
    </div>

    <div id="featured-carousel" class="flex gap-3 overflow-x-auto no-scrollbar px-4 pb-1"></div>
  </section>

  <!-- Основная лента матчей -->
  <main class="px-4 mt-4">
    <div class="flex items-center justify-between mb-2.5">
      <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-500">
        Линия и шанс на победу
      </h2>
      <span id="matches-count" class="text-[11px] text-slate-400 font-medium">Загрузка...</span>
    </div>

    <div id="matches-list" class="space-y-3.5"></div>
  </main>

  <!-- Нижняя навигация -->
  <nav class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur border-t border-slate-200 px-6 py-2.5 flex justify-between items-center text-[11px] font-medium text-slate-400 z-20">
    <button onclick="setFilter('all')" class="flex flex-col items-center text-[#0F172A] font-bold">
      <span class="text-base mb-0.5">📊</span>
      Матчи
    </button>
    <button onclick="setFilter('value')" class="flex flex-col items-center hover:text-[#0F172A]">
      <span class="text-base mb-0.5">🔥</span>
      Валуи
    </button>
    <button onclick="if(matchesData.length) openSheet(matchesData[0])" class="flex flex-col items-center hover:text-[#0F172A]">
      <span class="text-base mb-0.5">🧠</span>
      Объяснения
    </button>
    <button onclick="loadMatchesFromFeed(true)" class="flex flex-col items-center hover:text-[#0F172A]">
      <span class="text-base mb-0.5">🔄</span>
      Обновить
    </button>
  </nav>

  <!-- Модальное окно (Bottom Sheet) с объяснением шансов на победу -->
  <div id="sheet-backdrop" onclick="closeSheet()" class="sheet-backdrop fixed inset-0 bg-slate-900/60 z-30 opacity-0 pointer-events-none"></div>
  <div id="sheet-panel" class="sheet-panel fixed bottom-0 inset-x-0 bg-white rounded-t-3xl z-40 p-5 shadow-2xl translate-y-full max-h-[88vh] overflow-y-auto">
    <div class="w-10 h-1 bg-slate-300 rounded-full mx-auto mb-4"></div>
    <div id="sheet-content"></div>
  </div>

    let matchesData = [];
    let currentFilter = 'all';

    // Автоматическая загрузка свежих матчей из matches.json
    async function loadMatchesFromFeed(manual = false) {
      const statusEl = document.getElementById('sync-status');
      if (manual) statusEl.textContent = 'Обновление линии БК...';

      try {
        // Добавляем timestamp, чтобы Telegram не отдавал старый кэш
        const response = await fetch(`./matches.json?t=${Date.now()}`);
        if (!response.ok) throw new Error('JSON feed not found yet');

        const data = await response.json();
        if (data.matches && data.matches.length > 0) {
          matchesData = data.matches;
          statusEl.textContent = `Обновлено: ${data.updated_at || 'сегодня'}`;
        } else {
          throw new Error('Empty feed');
        }
      } catch (err) {
        // Используем встроенные матчи, если внешний JSON ещё не сгенерирован
        matchesData = fallbackMatches;
        const today = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
        statusEl.textContent = `${today} • Автопоиск активен`;
      }

      renderFeatured();
      renderMatches();
    }

            <span class="bg-slate-800 px-2 py-0.5 rounded text-slate-200 font-medium">${m.time.includes(', ') ? m.time.split(', ')[1] : m.time}</span>

              <span class="font-bold text-sm truncate">${m.team1}</span>
            </div>

          </div>

              <span>Х ${m.prob.x}%</span>
              <span>П2 ${m.prob.p2}%</span>
            </div>
            <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden flex gap-0.5">
              <div class="bg-blue-500 h-full" style="width: ${m.prob.p1}%"></div>
              <div class="bg-slate-500 h-full" style="width: ${m.prob.x}%"></div>
              <div class="bg-slate-300 h-full" style="width: ${m.prob.p2}%"></div>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-1.5 text-center pt-1">
            <div class="bg-slate-800/90 rounded-lg py-1">
              <span class="text-[9px] text-slate-400 block">П1</span>

    function renderMatches() {
      const container = document.getElementById('matches-list');
      const filtered = matchesData.filter(m => {
        if (currentFilter === 'all') return true;
        if (currentFilter === 'value') return m.isValue;
        return m.sport === currentFilter;
      });

      container.innerHTML = filtered.map(m => `

                ${m.favorite.team} — <span class="text-blue-400">${m.favorite.chance}%</span>

            </div>

            </div>
          </div>

          <div class="grid grid-cols-3 gap-2 pt-2.5 border-t border-slate-100">
            <div class="bg-blue-50/70 border border-blue-200 rounded-xl p-2 text-center">

              <div class="text-sm font-extrabold text-[#1E3A8A]">${m.bestOdds.p1.val}</div>
            </div>
            <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-2 text-center">
              <div class="text-[10px] text-slate-500 font-medium truncate">Х • ${m.bestOdds.x.bk}</div>
              <div class="text-sm font-bold text-[#0F172A]">${m.bestOdds.x.val}</div>
            </div>
            <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-2 text-center">
              <div class="text-[10px] text-slate-500 font-medium truncate">П2 • ${m.bestOdds.p2.bk}</div>
              <div class="text-sm font-bold text-[#0F172A]">${m.bestOdds.p2.val}</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.filter === filter) {
          btn.className = 'filter-btn bg-white text-[#0F172A] font-semibold text-xs px-3.5 py-1.5 rounded-full shrink-0 shadow-sm transition';
        } else {
          btn.className = 'filter-btn bg-slate-800/80 text-slate-300 hover:text-white font-medium text-xs px-3.5 py-1.5 rounded-full shrink-0 transition';
        }
      });
      renderMatches();
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => setFilter(btn.dataset.filter));
    });

    function openSheetById(id) {
      const match = matchesData.find(m => m.id === id);
      if (match) openSheet(match);
    }

    function openSheet(m) {
      const content = document.getElementById('sheet-content');
      content.innerHTML = `
        <div class="flex justify-between items-start mb-3">
          <div>
            <span class="text-[11px] font-bold text-[#1E3A8A] uppercase">${m.league}</span>
            <h3 class="text-lg font-extrabold text-[#0F172A] mt-0.5">${m.flag1} ${m.team1} — ${m.team2} ${m.flag2}</h3>
            <p class="text-xs text-slate-400 mt-0.5">${m.time} • ${m.venue}</p>
          </div>
          <button onclick="closeSheet()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold text-sm flex items-center justify-center">✕</button>
        </div>

        <div class="bg-[#0F172A] text-white rounded-2xl p-4 mb-4">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs text-slate-300 font-medium">Фаворит по расчёту модели</span>
            <span class="bg-blue-600 text-white text-xs font-extrabold px-2.5 py-0.5 rounded-full">
              Шанс ${m.favorite.chance}%
            </span>
          </div>
          <div class="text-base font-extrabold text-white mb-2">
            ${m.favorite.team} (${m.favorite.side})
          </div>
          <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden flex gap-0.5">
            <div class="bg-blue-500 h-full" style="width: ${m.prob.p1}%"></div>
            <div class="bg-slate-500 h-full" style="width: ${m.prob.x}%"></div>
            <div class="bg-slate-300 h-full" style="width: ${m.prob.p2}%"></div>
          </div>
          <div class="flex justify-between text-[11px] text-slate-300 font-semibold mt-1.5">
            <span>${m.team1}: ${m.prob.p1}%</span>
            <span>Ничья: ${m.prob.x}%</span>
            <span>${m.team2}: ${m.prob.p2}%</span>
          </div>
        </div>

        <div class="mb-4">
          <div class="flex items-center gap-2 mb-2">
            <span class="w-6 h-6 rounded-lg bg-blue-50 text-[#1E3A8A] flex items-center justify-center text-xs font-extrabold">📋</span>
            <h4 class="text-sm font-extrabold text-[#0F172A]">Объяснение: почему выше шанс на победу</h4>
          </div>

          <div class="bg-blue-50/70 border border-blue-200/80 rounded-2xl p-3.5 mb-3">
            <p class="text-xs font-semibold text-[#0F172A] leading-relaxed">
              ${m.explanationSummary}
            </p>
          </div>

          <div class="space-y-2.5">
            ${m.reasons.map((r, idx) => `
              <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-3">
                <div class="flex items-center gap-2 mb-1">
                  <span class="w-5 h-5 rounded-full bg-[#0F172A] text-white text-[10px] font-bold flex items-center justify-center shrink-0">
                    ${idx + 1}
                  </span>
                  <span class="text-xs font-bold text-[#0F172A]">${r.title}</span>
                </div>
                <p class="text-xs text-slate-600 leading-relaxed pl-7">${r.detail}</p>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="text-xs font-extrabold uppercase tracking-wider text-slate-500 mb-2">
          Коэффициенты букмекерских контор
        </div>
        <div class="border border-slate-200 rounded-2xl overflow-hidden mb-2">
          <table class="w-full text-xs text-left">
            <thead class="bg-[#0F172A] text-white">
              <tr>
                <th class="py-2.5 px-3 font-semibold">Букмекер</th>
                <th class="py-2.5 px-3 text-center font-semibold">П1 (${m.prob.p1}%)</th>
                <th class="py-2.5 px-3 text-center font-semibold">Х (${m.prob.x}%)</th>
                <th class="py-2.5 px-3 text-center font-semibold">П2 (${m.prob.p2}%)</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${m.bookmakers.map(bk => `
                <tr class="bg-white">
                  <td class="py-2.5 px-3 font-bold text-[#0F172A]">${bk.name}</td>
                  <td class="py-2.5 px-3 text-center font-semibold ${bk.p1 === m.bestOdds.p1.val ? 'text-[#1E3A8A] bg-blue-50/70 font-extrabold' : 'text-slate-700'}">${bk.p1}</td>
                  <td class="py-2.5 px-3 text-center font-semibold ${bk.x === m.bestOdds.x.val ? 'text-[#1E3A8A] bg-blue-50/70 font-extrabold' : 'text-slate-700'}">${bk.x}</td>
                  <td class="py-2.5 px-3 text-center font-semibold ${bk.p2 === m.bestOdds.p2.val ? 'text-[#1E3A8A] bg-blue-50/70 font-extrabold' : 'text-slate-700'}">${bk.p2}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      document.getElementById('sheet-backdrop').classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById('sheet-panel').classList.remove('translate-y-full');
    }

    function closeSheet() {
      document.getElementById('sheet-backdrop').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('sheet-panel').classList.add('translate-y-full');
    }

    // Запуск автозагрузки при открытии приложения
    loadMatchesFromFeed();

    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0F172A');
      tg.setBackgroundColor('#F1F5F9');
    }
  </script>
</body>
</html>
