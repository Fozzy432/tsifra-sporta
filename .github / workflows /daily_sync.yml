name: Daily Matches Auto-Sync

on:
  schedule:
    # Автоматический запуск 4 раза в день (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Кнопка ручного запуска в интерфейсе GitHub

permissions:
  contents: write

jobs:
  sync-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код репозитория
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить библиотеки
        run: pip install requests

      - name: Найти новые матчи и рассчитать шансы
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python update_matches.py

      - name: Сохранить обновлённый matches.json
        run: |
          git config user.name "TsifraSporta Bot"
          git config user.email "bot@tsifrasporta.local"
          git add matches.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily matches" && git push)
